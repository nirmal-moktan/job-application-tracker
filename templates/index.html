<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset ="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Job Application Tracker</title>
    </head>
    <body>
        <h1>Job Application Tracker</h1>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Company</th>
                    <th>Job Title</th>
                    <th>Location</th>
                    <th>Applied Date</th>
                    <th>Status</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody>
                {% for application in applications %}
                <tr>
                    <td>{{application[0]}} </td> <!-- inserting data in first column --> 
                    <td>{{application[1]}} </td> <!-- inserting data in second and so on column --> 
                    <td>{{application[2]}} </td>
                    <td>{{application[3]}} </td>
                    <td>{{application[4]}} </td>
                    <td>{{application[5]}} </td>
                    <td>{{application[6]}} </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </body>
</html>
